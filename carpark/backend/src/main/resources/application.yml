spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/parking_system?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  main:
    allow-bean-definition-overriding: true
