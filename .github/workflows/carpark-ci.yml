name: Car Park CI

on:
  push:
    paths:
      - 'carpark/**'
  pull_request:
    paths:
      - 'carpark/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: cd carpark/backend && mvn -B package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: carpark/frontend/package-lock.json
    - name: Install dependencies
      run: cd carpark/frontend && npm ci
    - name: Build
      run: cd carpark/frontend && npm run build
